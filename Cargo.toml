[package]
name = "exonous"
version = "2.10.2"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Native Exonous policy runtime"

[lib]
path = "native/src/lib.rs"

[[bin]]
name = "exonous"
path = "native/src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order", "float_roundtrip"] }
regex = "1.12.3"
sha1 = "0.10.6"
sha2 = "0.10.9"
toml = "0.9.11"
tar = { version = "0.4.44", default-features = false }
flate2 = "1.1.5"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[[test]]
name = "protocols"
path = "native/tests/protocols.rs"

[[test]]
name = "native_cli"
path = "native/tests/cli.rs"

[[test]]
name = "gate"
path = "native/tests/gate.rs"

[[test]]
name = "vault"
path = "native/tests/vault.rs"

[[test]]
name = "native_install"
path = "native/tests/install.rs"

[[test]]
name = "memory"
path = "native/tests/memory.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[test]]
name = "board"
path = "native/tests/board.rs"

[[test]]
name = "migrate"
path = "native/tests/migrate.rs"

[[test]]
name = "skill_memory"
path = "native/tests/skill_memory.rs"
