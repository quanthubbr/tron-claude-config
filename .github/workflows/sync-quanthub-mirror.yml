name: Sync quanthub mirror

# Mirrors main + tags to quanthubbr/tron-claude-config after each merge to main.
# quanthubbr repo is NOT a GitHub fork — this workflow replaces upstream PR sync.
#
# Required repo secret: QUANTHUB_SYNC_TOKEN
#   - Fine-grained PAT or classic token with contents:write on quanthubbr/tron-claude-config
#   - Add at: Settings → Secrets and variables → Actions → QUANTHUB_SYNC_TOKEN

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'zaqueu-1/tron-claude-config'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main and tags to quanthub mirror
        env:
          QUANTHUB_SYNC_TOKEN: ${{ secrets.QUANTHUB_SYNC_TOKEN }}
        run: |
          if [ -z "$QUANTHUB_SYNC_TOKEN" ]; then
            echo "QUANTHUB_SYNC_TOKEN not set — skipping mirror sync."
            echo "Add the secret to enable automatic sync to quanthubbr/tron-claude-config."
            exit 0
          fi
          git remote add quanthub "https://x-access-token:${QUANTHUB_SYNC_TOKEN}@github.com/quanthubbr/tron-claude-config.git"
          bash scripts/sync-quanthub-fork.sh
