    <rect x="478" width="110" height="36" rx="8" fill="rgba(167,139,250,0.12)" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="533" y="24" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">/make-pr</text>
