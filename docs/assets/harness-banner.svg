  <circle cx="980" cy="80" r="120" fill="rgba(45,212,191,0.08)"/>
  <circle cx="1080" cy="260" r="90" fill="rgba(56,189,248,0.08)"/>
  <rect x="64" y="72" width="8" height="216" rx="4" fill="url(#accent)"/>
  <text x="96" y="120" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700">@tron/claude-config</text>
  <text x="96" y="172" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="600">Enforcement harness for Claude Code</text>
  <text x="96" y="220" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">Hooks · Reviews · Scoped ECC rules · Auto-update</text>
  <g transform="translate(96, 260)">
